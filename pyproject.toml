[project]
name = "kws-de"
version = "0.1.0"
description = "German keyword-spotting model for ESP32-S3 (buspi camper voice control)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "tensorflow>=2.16,<2.19",  # tensorflow-metal 1.2.0 plugin ABI; newer TF fails to load it
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile>=0.12",
  # MSWC (MLCommons/ml_spoken_words) is still a loading-script dataset on the Hub;
  # `datasets>=4` dropped script support entirely, so pin below that.
  "datasets>=2.19,<4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# ruff pinned exactly: `ruff format` output drifts across releases, so an
# unpinned floor makes CI's format-check flake whenever a new ruff ships.
dev = ["pytest>=8", "ruff==0.16.5"]
# Apple-Silicon GPU (MPS) acceleration — optional, CPU training works without it.
metal = ["tensorflow-metal>=1.1"]
# Piper neural TTS engine (offline, permissive-licensed German voices).
tts = ["piper-tts>=1.2"]
# Wake-stage training only (Piper TTS "Hey Bus" positives + microWakeWord's
# trainer); runtime just loads the resulting tflite, no extra deps needed.
# Not on PyPI — installed straight from its GitHub repo.
train = ["microwakeword @ git+https://github.com/kahrendt/microWakeWord"]
# Firmware requirements-traceability docs (docs/sphinx): sphinx-needs for
# req/test traceability, breathe for the Doxygen C API reference.
docs = ["sphinx>=7", "breathe>=4.35", "sphinx-needs>=2"]
# kws-qc CLI's real transcriber (Apple-Silicon MLX Whisper). Core qc.py runs
# without it via an injected Transcriber; only whisper_transcriber() needs it.
qc = ["mlx-whisper>=0.4"]
# The TFLite-Micro audio frontend microWakeWord trains against, exposed as a
# Python extension. Only needed to regenerate the wake front-end golden vector
# (`kws-fwgen`); the committed header and the firmware need nothing extra.
wake = ["pymicro-features>=2.0.2"]

[project.scripts]
kws-data = "kws_de.data:main"
kws-train = "kws_de.train:main"
kws-export = "kws_de.export:main"
kws-eval = "kws_de.eval:main"
kws-dataset = "kws_de.dataset:main"
kws-benchmark = "kws_de.benchmark:main"
kws-fwgen = "kws_de.firmware_gen:main"
kws-transducer = "kws_de.transducer:main"
kws-distill = "kws_de.distill:main"
kws-qc = "kws_de.qc:main"

[tool.pytest.ini_options]
# data/ is a gitignored local cache (raw MSWC/ESC-50 clips); ESC-50 ships its own
# tests/ dir that pytest would otherwise try to collect too.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Planning docs embed illustrative (non-executed) code fences — not real source, don't format.
extend-exclude = ["docs/superpowers"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["kws_de*"]
