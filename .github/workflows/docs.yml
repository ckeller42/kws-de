name: docs
# Build the Sphinx docs (architecture + LikeC4 diagrams + eval reports) and publish
# to GitHub Pages: https://ckeller42.github.io/kws-de/

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # No path filter on pull requests: docs-build and firmware-docs are required
  # status checks on main, so they must report on every PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref, and a newer push to the same ref supersedes the older run. The
# previous workflow-wide `pages` group was shared by every branch: pushes to two PRs a
# few minutes apart queued in one slot and GitHub cancelled the superseded run -- which
# was the other PR's required docs-build/firmware-docs checks (E69). Pages deploys are
# still serialised, by the deploy job's own group below.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # ubuntu-latest runners ship node >= 20, which sphinx-likec4 needs — no setup-node step.
      - name: Install doc toolchain
        run: pip install -r docs/requirements.txt
      - name: Build HTML
        run: python -m sphinx -b html docs docs/_build/html
      # The firmware requirements/traceability/API site (docs/sphinx) is published
      # under /sphinx/ of the same Pages site, so it is reachable, not only a CI artifact.
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Doxygen XML (firmware C API)
        run: cd firmware && doxygen Doxyfile
      - run: pip install uv
      - run: uv sync --frozen --extra docs
      - name: Build firmware/pipeline docs into the site
        run: uv run sphinx-build -W --keep-going -b html docs/sphinx docs/_build/html/sphinx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: docs-build
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Firmware requirements-traceability + Doxygen API docs (docs/sphinx),
  # separate from the architecture docs above: build + upload only, no
  # Pages deploy.
  firmware-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Doxygen XML (firmware C API)
        run: cd firmware && doxygen Doxyfile
      - run: pip install uv
      - run: uv sync --frozen --extra docs
      - name: Sphinx build (requirements traceability + API)
        run: uv run sphinx-build -W --keep-going -b html docs/sphinx docs/sphinx/_build/html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kws-de-firmware-docs
          path: docs/sphinx/_build/html
          retention-days: 30
