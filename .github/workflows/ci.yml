name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev,qat]"
      - run: ruff check . && ruff format --check .
      - name: Tests + coverage gate (pure modules >= 85%)
        run: |
          pip install pytest-cov
          pytest -q --cov=kws_de.features --cov=kws_de.budgets --cov=kws_de.data \
            --cov=kws_de.grammar --cov=kws_de.stream --cov=kws_de.manifest \
            --cov=kws_de.ctc --cov=kws_de.phrases \
            --cov=kws_de.mswc --cov=kws_de.recordings --cov=kws_de.distill \
            --cov-fail-under=85
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --yes markdownlint-cli@0.42.0 --config .markdownlint.json '**/*.md'
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact -v
